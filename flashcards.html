<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOEFL Junior Vocabulary Flashcards New</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    font-family: Arial, "Microsoft YaHei", sans-serif;
    background: #f6f7f9;
    color: #202124;
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { text-align: center; margin: 8px 0 22px; font-size: 28px; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 10px;
    justify-content: center; margin-bottom: 18px;
  }
  select, button {
    font: inherit;
    padding: 10px 14px;
    border: 1px solid #d0d5db;
    border-radius: 9px;
    background: white;
    cursor: pointer;
  }
  button:hover, select:hover { background: #f0f2f5; }
  .progress {
    text-align: center;
    color: #5f6368;
    margin-bottom: 14px;
    font-size: 16px;
  }
  .card-area { perspective: 1200px; }
  .flashcard {
    position: relative;
    min-height: 390px;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform .45s ease;
  }
  .flashcard.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute; inset: 0;
    min-height: 390px;
    border-radius: 20px;
    background: white;
    box-shadow: 0 8px 28px rgba(0,0,0,.10);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 36px;
    backface-visibility: hidden;
    text-align: center;
  }
  .card-back { transform: rotateY(180deg); }
  .word {
    font-size: 52px;
    font-weight: 700;
    margin-bottom: 14px;
    word-break: break-word;
  }
  .phonetic { font-size: 20px; color: #6b7280; margin-bottom: 28px; }
  .meaning {
    font-size: 30px;
    line-height: 1.55;
    max-width: 800px;
    margin-bottom: 20px;
  }
  .list-label { color: #7a7f87; margin-top: 8px; }
  .hint { color: #9aa0a6; font-size: 15px; }
  .audio-button {
    border: 0;
    border-radius: 50%;
    width: 58px; height: 58px;
    font-size: 27px;
    background: #eef1f5;
    margin: 2px 0 18px;
    cursor: pointer;
  }
  .audio-button:hover { background: #e1e5ea; }
  .audio-button:disabled { opacity: .45; cursor: default; }
  .navigation {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 22px;
  }
  .navigation button { min-width: 110px; }
  .message { text-align: center; margin-top: 16px; color: #b3261e; min-height: 24px; }
  .status {
    text-align: center; font-size: 13px; color: #7a7f87; margin-top: 10px;
  }
  @media (max-width: 600px) {
    body { padding: 14px; }
    h1 { font-size: 23px; }
    .flashcard, .card-face { min-height: 330px; }
    .word { font-size: 38px; }
    .meaning { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>TOEFL Junior Vocabulary Flashcards New</h1>

  <div class="controls">
    <select id="listSelect">
      <option value="all">全部 List</option>
    </select>

    <select id="modeSelect">
      <option value="en-zh">英译中</option>
      <option value="zh-en">中译英</option>
    </select>

    <button id="shuffleButton">随机排序</button>
    <button id="restartButton">重新开始</button>
  </div>

  <div class="progress" id="progress">正在读取词汇……</div>

  <div class="card-area">
    <div class="flashcard" id="flashcard">
      <div class="card-face card-front">
        <div class="word" id="frontWord"></div>
        <div class="phonetic" id="frontPhonetic"></div>
        <button class="audio-button" id="audioButton" title="播放单词音频" aria-label="播放单词音频">🔊</button>
        <div class="hint" id="frontHint">点击卡片查看中文意思</div>
      </div>

      <div class="card-face card-back">
        <div class="meaning" id="backMeaning"></div>
        <div class="word" id="backWord"></div>
        <div class="phonetic" id="backPhonetic"></div>
        <div class="list-label" id="backList"></div>
        <div class="hint" id="backHint">点击卡片返回</div>
      </div>
    </div>
  </div>

  <div class="navigation">
    <button id="previousButton">上一张</button>
    <button id="nextButton">下一张</button>
  </div>

  <div class="status" id="status">词汇总数：2073</div>
  <div class="message" id="message"></div>
</div>

let currentWords = [];
let currentIndex = 0;
let isRandom = false;

const listSelect = document.getElementById("listSelect");
const modeSelect = document.getElementById("modeSelect");
const flashcard = document.getElementById("flashcard");
const frontWord = document.getElementById("frontWord");
const frontPhonetic = document.getElementById("frontPhonetic");
const backMeaning = document.getElementById("backMeaning");
const backWord = document.getElementById("backWord");
const backPhonetic = document.getElementById("backPhonetic");
const backList = document.getElementById("backList");
const frontHint = document.getElementById("frontHint");
const backHint = document.getElementById("backHint");
const audioButton = document.getElementById("audioButton");
const progress = document.getElementById("progress");
const message = document.getElementById("message");
const status = document.getElementById("status");

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function createListOptions() {
  for (let i = 1; i <= 33; i++) {
    const option = document.createElement("option");
    option.value = String(i);
    option.textContent = "List " + i;
    listSelect.appendChild(option);
  }
}

function getAudioUrl(item) {
  if (!audioMap || !audioMap.lists) return "";
  const listKey = String(item.list);
  const wordKey = String(item.word || "").trim().toLowerCase();
  const record = audioMap.lists?.[listKey]?.[wordKey];
  return record?.fileId ? audioProxyBase + record.fileId + "/download?download_frd=1" : "";
}

function applyFilter() {
  const selected = listSelect.value;
  currentWords = selected === "all"
    ? [...allWords]
    : allWords.filter(item => String(item.list) === selected);

  if (isRandom) shuffle(currentWords);
  currentIndex = 0;
  showCard();
}

function showCard() {
  flashcard.classList.remove("flipped");
  message.textContent = "";

  if (!currentWords.length) {
    progress.textContent = "没有找到词汇";
    return;
  }

  const item = currentWords[currentIndex];
  const mode = modeSelect.value;

  if (mode === "en-zh") {
    frontWord.textContent = item.word || "";
    frontPhonetic.textContent = item.phonetic || "";
    frontHint.textContent = "点击卡片查看中文意思";
    backMeaning.textContent = item.meaning || "";
    backWord.textContent = item.word || "";
    backPhonetic.textContent = item.phonetic || "";
    backHint.textContent = "点击卡片返回英文";
  } else {
    frontWord.textContent = item.meaning || "";
    frontPhonetic.textContent = "";
    frontHint.textContent = "点击卡片查看英文单词";
    backMeaning.textContent = "";
    backWord.textContent = item.word || "";
    backPhonetic.textContent = item.phonetic || "";
    backHint.textContent = "点击卡片返回中文";
  }

  backList.textContent = "List " + item.list;
  progress.textContent = `第 ${currentIndex + 1} / ${currentWords.length} 张`;

  const audioUrl = getAudioUrl(item);
  audioButton.disabled = !audioUrl;
  audioButton.title = audioUrl ? "播放单词音频" : "暂无音频";
}

let currentAudio = null;

function playAudio() {
  const item = currentWords[currentIndex];
  if (!item) return;
  const url = getAudioUrl(item);
  if (!url) {
    message.textContent = "这个单词暂时没有找到对应音频。";
    return;
  }

  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
  }

  currentAudio = new Audio(url);
  currentAudio.preload = "auto";
  currentAudio.play().catch(err => {
    console.error(err);
    message.textContent = "音频播放失败，请稍后再试。";
  });
}

function nextCard() {
  if (!currentWords.length) return;
  currentIndex = (currentIndex + 1) % currentWords.length;
  showCard();
}

function previousCard() {
  if (!currentWords.length) return;
  currentIndex = (currentIndex - 1 + currentWords.length) % currentWords.length;
  showCard();
}

flashcard.addEventListener("click", () => {
  flashcard.classList.toggle("flipped");
});

audioButton.addEventListener("click", (event) => {
  event.stopPropagation();
  playAudio();
});

document.getElementById("nextButton").addEventListener("click", nextCard);
document.getElementById("previousButton").addEventListener("click", previousCard);

listSelect.addEventListener("change", applyFilter);

modeSelect.addEventListener("change", () => {
  showCard();
});

document.getElementById("shuffleButton").addEventListener("click", () => {
  isRandom = true;
  shuffle(currentWords);
  currentIndex = 0;
  showCard();
});

document.getElementById("restartButton").addEventListener("click", () => {
  currentIndex = 0;
  if (isRandom) shuffle(currentWords);
  showCard();
});

document.addEventListener("keydown", event => {
  if (event.key === "ArrowRight") nextCard();
  if (event.key === "ArrowLeft") previousCard();
  if (event.code === "Space") {
    event.preventDefault();
    flashcard.classList.toggle("flipped");
  }
});

async function init() {
  createListOptions();
  status.textContent = `词汇总数：${allWords.length}（最新 2026-09-27 词汇表）`;
  applyFilter();
  showCard();
}
init();
</script>
